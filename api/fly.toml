# fly.toml app configuration file generated for flagon-api on 2026-09-17T03:56:11Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'flagon-api'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Keep one machine always warm (no cold start on the common path); let any
  # extra machines stop when idle so we only pay for capacity under load.
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '5s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
