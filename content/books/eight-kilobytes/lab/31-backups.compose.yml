# The lab for "An untested backup is a rumor": a PostgreSQL 18 primary with
# continuous WAL archiving and WAL summaries on, so the lab can take dumps,
# base backups, and incremental backups, and restore them for real.
#
#   ./lab 31   # starts this, runs every check, tears it down
#
# /archive and /backups are scratch space (tmpfs) inside the container; the
# restores run as extra servers on other ports inside the same container.
name: ek-backups

services:
  pg:
    image: postgres:18.6
    environment:
      POSTGRES_PASSWORD: postgres
      PGUSER: postgres
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /archive/%f && cp %p /archive/%f
      - -c
      - archive_timeout=60
      - -c
      - summarize_wal=on
    shm_size: 256m
    volumes:
      - type: tmpfs
        target: /archive
        tmpfs:
          mode: 01777
      - type: tmpfs
        target: /backups
        tmpfs:
          mode: 01777
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 60

  # A second container for the major-version upgrade: the lab installs the
  # PostgreSQL 17 binaries into it (from the image's own apt repository),
  # builds a 17 cluster, and upgrades it to 18 with pg_upgrade --link.
  upgrade:
    image: postgres:18.6
    entrypoint: ["sleep", "infinity"]
    init: true
