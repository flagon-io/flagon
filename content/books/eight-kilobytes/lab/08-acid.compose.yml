# One PostgreSQL 18 server for the crash tests in "ACID, honestly".
# 08-acid.sh starts it, kills it with SIGKILL several times, restarts it,
# checks what survived, and throws it all away. No ports are published; the
# script talks to the server through `docker compose exec`.
#
#   ./lab 08
#
# Settings that differ from the defaults, and why (08-acid.sh also sets
# wal_writer_delay with ALTER SYSTEM, so it can change it mid-run):
#   max_prepared_transactions=10   lets the two-phase commit demo run
#                                  (default 0, which disables it)
#   checkpoint_timeout=1h          no surprise checkpoint during a test
#   recovery_init_sync_method=syncfs
#                                  after a crash, Postgres fsyncs the whole
#                                  data directory before recovery; one
#                                  syncfs() call is much faster than a
#                                  fsync() per file (default fsync)
name: ek-acid

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_PASSWORD: postgres
      PGUSER: postgres
    command:
      - postgres
      - -c
      - max_prepared_transactions=10
      - -c
      - checkpoint_timeout=1h
      - -c
      - recovery_init_sync_method=syncfs
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 1s
      timeout: 5s
      retries: 120

volumes:
  pgdata:
