# The extensions lab for "Eight Kilobytes": two PostgreSQL 18 servers.
# 15-extensions.sh starts them, runs the chapter's checks, and throws them away.
#
#   ./lab 15
#
# postgres:     the PostGIS image (postgis/postgis, which is the official
#               postgres:18 image plus PostGIS), with third-party extensions
#               added from the PostgreSQL project's own apt repository
#               (apt.postgresql.org), which that image already trusts.
# timescaledb:  Timescale's own image, with the Timescale License build of
#               TimescaleDB (the -oss tags are the Apache-2.0-only build).
#
# No ports are published; the script talks to both servers through
# `docker compose exec`.
name: ek-extensions

services:
  postgres:
    build:
      context: .
      dockerfile_inline: |
        FROM postgis/postgis:18-3.6
        RUN apt-get update \
         && apt-get install -y --no-install-recommends \
              postgresql-18-cron postgresql-18-partman postgresql-18-repack \
              postgresql-18-squeeze postgresql-18-pgaudit postgresql-18-hypopg \
              postgresql-18-pg-hint-plan postgresql-18-age postgresql-18-pljs \
              postgresql-plpython3-18 \
         && rm -rf /var/lib/apt/lists/*
    image: ek-extensions-postgres:18
    environment:
      POSTGRES_PASSWORD: postgres
      PGUSER: postgres
      # pg_cron's scheduler connects to this database from the first start.
      POSTGRES_DB: lab
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements,pg_cron,pgaudit,pg_squeeze
      - -c
      - cron.database_name=lab
      - -c
      - wal_level=logical
      - -c
      # pg_squeeze decodes WAL with its own output plugin; since 18.6 the
      # server only loads plugins named here.
      - output_plugin_libraries=pgoutput,test_decoding,pg_squeeze
      - -c
      - shared_buffers=256MB
    shm_size: 256m
    volumes:
      - ./:/lab:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 2s
      timeout: 5s
      retries: 180
      start_period: 5s

  timescaledb:
    image: timescale/timescaledb:2.30.2-pg18
    environment:
      POSTGRES_PASSWORD: postgres
      PGUSER: postgres
      # Skip timescaledb-tune: keep the image's defaults small and predictable.
      NO_TS_TUNE: "true"
    command:
      - postgres
      - -c
      - shared_buffers=256MB
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 2s
      timeout: 5s
      retries: 180
      start_period: 5s
