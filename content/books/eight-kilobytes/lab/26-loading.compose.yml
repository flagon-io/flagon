# Two PostgreSQL 18 servers for "Load it fast", started and thrown away by
# 26-loading.sh. No ports are published; the script talks to them through
# `docker compose exec`.
#
#   ./lab 26
#
#   pg        stock settings (wal_level = replica, max_wal_size = 1GB): the
#             server the chapter's comparison table was measured on
#   minimal   wal_level = minimal, which needs max_wal_senders = 0 and means
#             no replicas and no point-in-time recovery; it exists to show the
#             one loading trick that only works there
name: ek-loading

x-pg: &pg
  image: postgres:18.6
  environment:
    POSTGRES_PASSWORD: postgres
    PGUSER: postgres
  shm_size: 512m
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
    interval: 1s
    timeout: 5s
    retries: 120

services:
  pg:
    <<: *pg
    command: ["postgres"]
    volumes:
      - pgdata:/var/lib/postgresql
  minimal:
    <<: *pg
    command: ["postgres", "-c", "wal_level=minimal", "-c", "max_wal_senders=0"]
    volumes:
      - minimaldata:/var/lib/postgresql

volumes:
  pgdata:
  minimaldata:
