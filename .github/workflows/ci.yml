name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Better Auth derives its origin from this at build and start; without it the
  # `next build` logs "[Better Auth] Base URL is not set". CI builds are never
  # deployed (Vercel sets the real value in prod), so the local origin is the
  # correct value for the lint/unit/e2e builds here.
  BETTER_AUTH_URL: http://localhost:3000

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    # A throwaway Postgres so the DB integration tests actually run in CI - most
    # importantly the tenant-isolation (RLS) and audit round-trip tests, which
    # otherwise SKIP (they gate on FLAGON_TEST_DATABASE_URL) and leave our core
    # multi-tenant guarantee unverified. The default `postgres` superuser can
    # CREATE ROLE, which Setup needs to provision the NOBYPASSRLS app role.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flagon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
      - run: go build ./...
      - run: go vet ./...
      # -race catches data races (the API is heavily concurrent: HTTP handlers,
      # the agent, background workers); -shuffle=on stops tests depending on order.
      - run: go test -race -shuffle=on ./...
        env:
          FLAGON_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/flagon_test?sslmode=disable
      # Documentation is part of the work: fail if the docs corpus is stale, so a
      # doc edit that skipped `make docs` (or code that changed without its docs)
      # never lands on main.
      - run: go run ./cmd/gendocs -check
      # The roadmap is part of the work too: fail if its corpus is stale, so a
      # roadmap edit that skipped `make roadmap` never lands on main.
      - run: go run ./cmd/genroadmap -check
      # Same for the changelog corpus.
      - run: go run ./cmd/genchangelog -check

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      # npm workspaces: install and run from the repo root (the single lockfile
      # lives there; the root `lint`/`build` scripts delegate to the app workspace).
      # The committed lockfile carries every platform's native-binary nodes
      # (lightningcss, tailwind oxide, ...), so `npm ci` installs the Linux ones
      # here. If you ever see "Cannot find module '*.linux-x64-gnu.node'", the lock
      # was regenerated on a single OS and lost the other platforms - regenerate
      # it with a clean from-scratch resolve (run `scripts/relock.sh`).
      - run: npm ci
      - run: npm run lint
      # Unit tests for the design system's pure logic + component render smokes
      # (Vitest in packages/ui). Integration behavior is covered by the e2e job.
      - run: npm run test:unit
      - run: npm run build

  # Real integration tests: Playwright drives a production build of the app and
  # exercises the component library through its live /ui docs. Every new component
  # gets a spec here (see app/tests) so the library stays provably stable.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: app
      - run: npm run build
      - run: npm run test:e2e
        working-directory: app
        env:
          CI: "true"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 7
