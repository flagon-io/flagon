name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      # Documentation is part of the work: fail if the docs corpus is stale, so a
      # doc edit that skipped `make docs` (or code that changed without its docs)
      # never lands on main.
      - run: go run ./cmd/gendocs -check

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      # npm workspaces: install and run from the repo root (the single lockfile
      # lives there; the root `lint`/`build` scripts delegate to the app workspace).
      # Use `npm install`, not `npm ci`: a lockfile generated on one OS omits the
      # `packages` entries for other platforms' native binaries (lightningcss,
      # tailwind oxide, ...), and `npm ci` installs only what's in that map, so it
      # fails on Linux. `npm install` resolves the current platform's optional
      # deps at install time (this is also how the Vercel build installs).
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
