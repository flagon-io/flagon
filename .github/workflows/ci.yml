name: CI

# Gate every push to main and every PR on: type-checking (the API's `lint` is
# `tsc --noEmit`), ESLint, and the Vitest suite — including the integration and
# tenancy tests, which run against a real Postgres AS A RESTRICTED, RLS-ENFORCING
# role, so row-level security is actually exercised (a superuser would silently
# bypass it). The full production build stays with Vercel, which runs it on deploy.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR cancels the older, still-running job.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest

    # A throwaway Postgres so the tenancy audit (and any future DB-backed test)
    # can run against a real, migrated database. Matches the local compose image.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: flagon
          POSTGRES_PASSWORD: flagon
          POSTGRES_DB: flagon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flagon"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://flagon:flagon@localhost:5432/flagon
      # The API hosts BetterAuth and validates this at boot; the integration
      # suite imports the app, so it must be present (any long non-prod value).
      BETTER_AUTH_SECRET: ci-test-secret-not-a-real-secret-0123456789

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint & typecheck
        run: npm run lint

      # Create the restricted, RLS-ENFORCING role (NOBYPASSRLS) BEFORE migrations,
      # exactly like production, where flagon_app pre-exists in Neon. This ordering
      # is load-bearing: the per-migration GRANTs are guarded on the role existing,
      # so creating it first makes those grants ACTUALLY RUN here.
      #
      # We deliberately do NOT blanket-grant ALL TABLES. CI must rely on the same
      # per-migration grants production does, so a migration that creates a table
      # but forgets to GRANT it to flagon_app turns CI RED — via the grants.audit
      # test and any query run as this role — instead of only exploding in prod
      # (which is exactly how SSO/SCIM broke on 2026-08-05). Only schema USAGE is
      # granted here (schema-level, not per-table, so it can't mask that bug class);
      # 0000_auth grants it too, this just guarantees the role can connect.
      - name: Create restricted app role
        env:
          PGPASSWORD: flagon
        run: |
          psql -h localhost -U flagon -d flagon -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE flagon_app LOGIN PASSWORD 'flagon_app' NOSUPERUSER NOBYPASSRLS" \
            -c "GRANT USAGE ON SCHEMA public TO flagon_app"

      # Apply both pipelines' migrations. With flagon_app already present, each
      # migration's guarded per-table GRANTs apply now — mirroring prod — so the
      # schema the suite runs against has exactly the grants the migrations give
      # (the tenancy audit still inspects the real schema + RLS policies too).
      - name: Apply migrations
        run: |
          npm run db:migrate -w @flagon/api
          npm run db:migrate -w @flagon/app

      # APP_DATABASE_URL (the restricted role) takes precedence in the DB client,
      # so every DB-backed test runs under RLS. --no-file-parallelism keeps the
      # DB-heavy suites off each other's toes.
      - name: Test (as the RLS-enforcing role)
        env:
          APP_DATABASE_URL: postgres://flagon_app:flagon_app@localhost:5432/flagon
        run: npm test -- --no-file-parallelism

      # Build Storybook so broken stories (design system + flag/targeting editors)
      # fail CI. Vite build, no DB/env needed; output is discarded.
      - name: Build Storybook
        run: npm run build-storybook -w apps/app
