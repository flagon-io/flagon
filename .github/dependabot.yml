version: 2

# Weekly dependency updates, grouped so a normal week is one or two pull
# requests, not a dozen. CI (.github/workflows/ci.yml) checks each one.

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # Majors we can't take yet. Patches and minors still come through.
    ignore:
      # Types track the Node runtime (.nvmrc / engines), not the newest Node.
      # Move both together when we change runtimes.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint doesn't support TypeScript 7 yet (lint fails on it).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # eslint-config-next's React plugin breaks on ESLint 10. Lift this once
      # eslint-config-next supports it.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
    groups:
      # Next and its ESLint config move together.
      next:
        patterns:
          - next
          - eslint-config-next
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      radix:
        patterns:
          - "@radix-ui/*"
      # Everything else that isn't a major bump, in one pull request.
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - "*"
