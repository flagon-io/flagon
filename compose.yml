name: flagon

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flagon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flagon}
      POSTGRES_DB: ${POSTGRES_DB:-flagon}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - flagon-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flagon} -d ${POSTGRES_DB:-flagon}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  flagon-postgres:
