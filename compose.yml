# The base stack binds no host ports, so it mirrors production and never
# collides with a Go/Next server you run natively on the same machine.
# compose.override.yml (applied automatically by `docker compose`) publishes
# the ports for local development - most importantly Postgres, so a natively
# run `go run` / `npm run dev` can reach it on localhost.
services:
  # One Postgres instance holding both databases (flagon_api + flagon_app) to
  # keep laptop resource use low. They stay separate databases, so the app/api
  # data boundary matches production - which runs them as two independent
  # instances (see .docker/postgres/01-create-app-db.sql to split them back).
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: flagon
      POSTGRES_PASSWORD: flagon
      POSTGRES_DB: flagon_api
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./.docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flagon"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      target: dev
    environment:
      # Migrator/owner role: the server uses it to run migrations + provision the
      # app role. `flagon-server serve` does this on boot (here and in
      # production alike), before it starts serving; air (api/.air.toml) runs
      # `serve` on every rebuild. `flagon-server migrate` does the same and exits.
      DATABASE_URL: postgres://flagon:flagon@postgres:5432/flagon_api?sslmode=disable
      # App role: RLS-enforced (NOBYPASSRLS) runtime login. `api migrate`
      # provisions this role (creates it, sets this password) from the migrator
      # connection, so nothing else needs to create it.
      FLAGON_APP_DATABASE_URL: postgres://flagon_app:flagon_app@postgres:5432/flagon_api?sslmode=disable
      # Shared secret the app authenticates to the API with (app<->API trust).
      FLAGON_INTERNAL_TOKEN: dev-internal-token
      # A container binds all interfaces, which the server would otherwise treat
      # as production (refusing development values like the token above).
      FLAGON_ENV: development
    volumes:
      - ./api:/src
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      # The npm workspace (app + packages/*) shares one lockfile at the repo
      # root, so the app image builds from the root.
      context: .
      dockerfile: app/Dockerfile
      target: dev
    environment:
      NEXT_PUBLIC_API_URL: http://api:8080
      # Server-side gateway to the Go API + the shared secret (must match the
      # api service's FLAGON_INTERNAL_TOKEN).
      FLAGON_API_URL: http://api:8080
      FLAGON_INTERNAL_TOKEN: dev-internal-token
      DATABASE_URL: postgres://flagon:flagon@postgres:5432/flagon_app?sslmode=disable
      BETTER_AUTH_SECRET: dev-only-secret-change-me-32-characters-min
      BETTER_AUTH_URL: http://localhost:4000
    volumes:
      - ./app:/src/app
      - ./packages:/src/packages
      # Keep the container's own (Linux) installs and build output, never the host's.
      - /src/node_modules
      - /src/app/node_modules
      - /src/app/.next
      - /src/packages/ui/node_modules
      - /src/packages/ui/dist
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  postgres-data:
